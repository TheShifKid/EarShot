<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page draw under the iPhone notch/home bar;
       we then pad with env(safe-area-inset-*) in CSS so nothing gets hidden. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0e0d">
  <meta name="description" content="Earshot: a swipeable music feed powered by Spotify. Save what you love, then get quizzed on what you heard.">
  <title>Earshot — swipe through new music</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f0e0d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff5b2e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    <!-- ============ FEED ============ -->
    <section id="view-feed" class="view view-feed" data-view="feed" aria-label="Feed">
      <header class="feed-top">
        <div class="feed-top-row">
          <p class="wordmark" aria-hidden="true">Earshot<span class="rec-lamp"></span></p>
          <p class="feed-hint">↑ ↓ to browse · space to pause</p>
        </div>
        <div class="chips" role="group" aria-label="Genres and moods">
          <button type="button" class="chip" data-genre="mix" aria-pressed="true">Mix</button>
          <button type="button" class="chip" data-genre="pop" aria-pressed="false">Pop</button>
          <button type="button" class="chip" data-genre="hiphop" aria-pressed="false">Hip-hop</button>
          <button type="button" class="chip" data-genre="rock" aria-pressed="false">Rock</button>
          <button type="button" class="chip" data-genre="indie" aria-pressed="false">Indie</button>
          <button type="button" class="chip" data-genre="electronic" aria-pressed="false">Electronic</button>
          <button type="button" class="chip" data-genre="rnb" aria-pressed="false">R&amp;B</button>
          <button type="button" class="chip" data-genre="chill" aria-pressed="false">Chill</button>
          <button type="button" class="chip chip-search" data-genre="search" aria-pressed="false" aria-expanded="false" aria-controls="search-form">Search</button>
        </div>
        <form id="search-form" class="search" role="search" hidden>
          <label class="visually-hidden" for="search-input">Search songs or artists</label>
          <input id="search-input" type="search" placeholder="Artist, song, anything…" autocomplete="off" enterkeyhint="search">
          <button type="submit" class="search-go">Go</button>
        </form>
      </header>

      <h1 class="visually-hidden">Song feed</h1>
      <div id="feed" class="feed" tabindex="-1"></div>

      <!-- The gate: Spotify setup → login → "Tap to start". The last step
           exists because browsers block sound until the user interacts. -->
      <div id="gate" class="gate">
        <div class="gate-inner">
          <p class="gate-kicker">Side A · Track 01</p>
          <p class="gate-word">Earshot</p>
          <div id="gate-body"></div>
        </div>
      </div>
    </section>

    <!-- ============ LIBRARY ============ -->
    <section id="view-library" class="view page" data-view="library" hidden>
      <header class="page-head">
        <p class="kicker">02 / Saved</p>
        <h1 tabindex="-1">Library</h1>
      </header>
      <div id="library-root"></div>
    </section>

    <!-- ============ QUIZ ============ -->
    <section id="view-quiz" class="view page" data-view="quiz" hidden>
      <header class="page-head">
        <p class="kicker">03 / Ear test</p>
        <h1 tabindex="-1">Quiz</h1>
      </header>
      <div id="quiz-root"></div>
    </section>

    <!-- ============ STATS ============ -->
    <section id="view-stats" class="view page" data-view="stats" hidden>
      <header class="page-head">
        <p class="kicker">04 / Liner notes</p>
        <h1 tabindex="-1">Stats</h1>
      </header>
      <div id="stats-root"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#feed" class="tab" data-tab="feed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>
      <span>Feed</span>
    </a>
    <a href="#library" class="tab" data-tab="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <span>Library</span>
    </a>
    <a href="#quiz" class="tab" data-tab="quiz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      <span>Quiz</span>
    </a>
    <a href="#stats" class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>
      <span>Stats</span>
    </a>
  </nav>

  <!-- One Spotify embed for the whole site. The iFrame API swaps songs into it. -->
  <aside id="dock" class="dock" aria-label="Spotify player" hidden>
    <div id="dock-embed"></div>
    <div id="dock-veil" class="dock-veil" hidden>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Mystery track: revealed after you answer</span>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Plain <script> tags (not ES modules) so the site also works when you
       double-click index.html. Order matters: each file uses the ones above it. -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/spotify.js"></script>
  <script src="js/player.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/library.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
