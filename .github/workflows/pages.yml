# Publishes the site to GitHub Pages on every push to main.
# The site has no build step, so this just uploads the repo files as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels nothing mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # "Cache busting": GitHub Pages tells browsers to keep files for 10
      # minutes, so right after a deploy people could still get the OLD
      # config.js or app code. Adding ?v=<commit id> to every CSS/JS link
      # makes each deploy's files look like brand-new URLs to the browser.
      - name: Stamp asset URLs with the commit id
        run: sed -i -E "s/(href=\"style\.css|src=\"js\/[a-z]+\.js)\"/\1?v=${GITHUB_SHA::8}\"/g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
